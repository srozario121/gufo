# build.conf — the constants build.sh builds the fork's runtime image with.
# Read AS TEXT by build.sh (KEY=VALUE, one per line; a `#` after whitespace
# starts a comment), never sourced. Only EXPECTED_DRV may also come from the
# caller's environment, where it wins.

# The upstream release this patch branch sits on. gufo re-points tags, so the
# commit is the pin and the tag is only its name.
# 2026-10-15 (item 113.2): moved with the managed pin to gufo v0.15.0, matching
# serving-gufo.env's SERVE_GUFO_FORK_BASE_* and gufo-fork.lock. The branch named
# by them (ai-sdlc/v0.15.0) is not cut yet; nothing builds here while the fork
# is pending. What is NOT resolved, and is ADR 0042 §7's job when the fork is
# re-cut: the TOOLBOXES_COMMIT below and the EXPECTED_DRV note are still
# v0.10.0's. The toolboxes revision whose flake input builds this release is
# neither daily bump — ad9db851af42 (2026-10-13 11:56 UTC) pins 058d6e80c210
# (v0.14.0) and 64c8b5516dae (2026-10-14 09:36 UTC) pins 942999e727fd — so §7
# resolves it against flake.lock and the built image's store path, not here.
# 2026-10-20: re-cut on gufo v0.19.0 (empty patch branch; toolboxes commit = the
# 'Publish Stable Gufo OCI Images' run 39412681513 for the release, 13 s after it).
# 2026-11-01: prepared for gufo v0.28.1 (the vocab-trim port's base; branch
# ai-sdlc/v0.28.1). Toolboxes commit = the 'Publish Stable Gufo Releases' run
# 41206936528, 7 s after the release was published; its logs name v0.28.1 and
# 12effe369662 and build packages.x86_64-linux.gufo-runtime-release-image with
# --override-input gufo-engine, on Nix 2.35.2 (the NIX_IMAGE below, unchanged).
# EXPECTED_DRV for this base is not known until the first unpatched build.
BASE_TAG=v0.28.1
BASE_COMMIT=12effe369662ac572cb100cd20157f56a74e2da0

# The toolboxes commit that built the release image (its release-workflow run
# 37926894479 started 13 s after the gufo release). It is exported with
# `git archive` into a path: flake, so self.rev is absent and the
# org.opencontainers.image.revision label reads `unknown`, as on the stock image.
TOOLBOXES_REPO=https://github.com/gufo-org/toolboxes
TOOLBOXES_COMMIT=58fdb5da62e0b61ac7b34689706d373e5ac2bbe4
TOOLBOXES_ATTR=packages.x86_64-linux.gufo-runtime-release-image

# Nix 2.35.2, the version the release CI ran, by digest. It is never pulled
# implicitly: `docker pull` it once by this digest.
NIX_IMAGE=nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c

# The Nix store lives in this named volume, under a disk budget (GiB) with a
# reserve left free on the volume's filesystem (and on the out dir's).
NIX_VOLUME=gufo-fork-nix
BUDGET_GIB=150
RESERVE_GIB=20

# Build jobs: MAX_JOBS x CORES must stay at or below 16.
MAX_JOBS=2
CORES=8

# The local image repository the build tags and labels.
IMAGE_REPO=ai-sdlc/gufo-runtime-fork

# The memory floors the build's watcher stops the container at (MiB).
MEM_FLOOR_MIB=3072
SWAP_FLOOR_MIB=1024

# Set for the empty patch branch: the derivation the stock release built. A
# different drv stops the build before it starts. Leave empty for a patched
# branch. For the empty ai-sdlc/v0.10.0 branch it is
#   /nix/store/izfwqpzfim1bz2n1nj3i6nsbpdww2q6w-gufo-runtime.tar.gz.drv
# (evaluated for both github:gufo-org/gufo/v0.10.0 and the fork's 3020d24).
EXPECTED_DRV=
